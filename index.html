<!DOCTYPE html>
<html lang="ko" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이가영 · Gayoung Lee</title>
<meta name="description" content="이가영 — 클라우드·보안 엔지니어 포트폴리오. AWS 인프라 설계, CI/CD 보안 자동화, 취약점 진단, 침해사고 대응 프로젝트.">
<meta property="og:title" content="이가영 · Gayoung Lee — Cloud Security Engineer">
<meta property="og:description" content="AWS 인프라 설계, CI/CD 보안 자동화, KISA 기준 취약점 진단, 침해사고 대응 프로젝트를 정리한 포트폴리오입니다.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090a0e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2385a3ea' stroke-width='1.4' opacity='0.55'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%238f73e7'/%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* 모든 색은 아래 JS가 색조(H)·채도(S)·밝기모드로부터 계산해 덮어씁니다 */
  :root{
    --wall:#090a0e; --wall2:#060709;
    --chrome:rgba(20,23,31,.86); --glass:rgba(27,31,39,.84);
    --line:rgba(143,164,214,.22); --line-hi:rgba(143,164,214,.44);
    --accent:#85a3ea; --accent2:#8f73e7; --on-accent:#0d121c;
    --text:#e8eaed; --dim:#aeb2bc; --faint:#6e7687; --strong:#fcfcfd;
    --g1:140,163,217; --g2:145,125,211;
    --shadow:rgba(0,0,0,.6);
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    --sans:'Pretendard', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); color:var(--text); background:var(--wall);
    overflow:hidden; -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  #rain{position:fixed; inset:0; z-index:0; opacity:.4; pointer-events:none;}
  .veil{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(68% 52% at 20% 2%, rgba(var(--g1),.16), transparent 62%),
      radial-gradient(56% 44% at 90% 88%, rgba(var(--g2),.1), transparent 60%),
      linear-gradient(rgba(var(--g1),.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--g1),.06) 1px, transparent 1px),
      linear-gradient(rgba(var(--g1),.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--g1),.1) 1px, transparent 1px);
    background-size:100% 100%, 100% 100%, 26px 26px, 26px 26px, 130px 130px, 130px 130px;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline; text-underline-offset:3px;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ====================== boot ====================== */
  #boot{
    position:fixed; inset:0; z-index:9999; background:var(--wall2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    font-family:var(--mono); transition:opacity .5s ease, visibility .5s;
  }
  #boot.done{opacity:0; visibility:hidden;}
  .boot-logo{
    font-family:var(--sans); font-size:clamp(34px,7vw,56px); font-weight:800;
    letter-spacing:-.045em; color:var(--strong); min-height:1.1em; line-height:1.1;
  }
  .boot-sub{font-size:11.5px; letter-spacing:.3em; color:var(--faint); text-transform:uppercase; margin-top:-8px;}
  .boot-lines{font-size:12px; color:var(--faint); height:86px; text-align:left; width:min(420px,86vw); line-height:1.9;}
  .boot-lines .ok{color:var(--accent2);}
  .track{width:min(420px,86vw); height:3px; background:rgba(var(--g1),.18); overflow:hidden;}
  .track i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s linear;}
  .boot-hint{font-size:11px; color:var(--faint);}

  /* ====================== menubar ====================== */
  .menubar{
    position:fixed; top:0; left:0; right:0; height:36px; z-index:400;
    display:flex; align-items:center; gap:16px; padding:0 14px;
    background:var(--chrome); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .menubar .logo{display:flex; align-items:center; gap:8px; font-weight:730; letter-spacing:-.015em; color:var(--text);}
  .menubar .logo i{width:9px; height:9px; border-radius:50%; background:var(--accent2); box-shadow:0 0 9px var(--accent2);}
  .menubar .mi{color:var(--dim); padding:4px 9px; border-radius:6px;}
  .menubar .mi:hover{background:rgba(var(--g1),.16); color:var(--text);}
  .menubar .right{margin-left:auto; display:flex; align-items:center; gap:13px; font-family:var(--mono); font-size:11.5px; color:var(--dim);}
  .menubar .st{display:flex; align-items:center; gap:6px;}
  .menubar .st i{width:6px; height:6px; border-radius:50%; background:var(--accent2);}

  /* ====================== color tuner ====================== */
  .tuner{position:relative;}
  .tuner > button{
    display:flex; align-items:center; gap:7px; padding:4px 10px; border-radius:7px;
    border:1px solid var(--line); color:var(--dim); font-family:var(--mono); font-size:11px;
  }
  .tuner > button:hover{background:rgba(var(--g1),.16); color:var(--text);}
  .tuner > button .sw{width:11px; height:11px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent2));}
  .tpanel{
    position:absolute; right:0; top:32px; width:252px; padding:16px 16px 14px;
    border:1px solid var(--line-hi); border-radius:11px; background:var(--chrome);
    backdrop-filter:blur(18px); box-shadow:0 20px 50px var(--shadow);
    font-family:var(--mono); font-size:11px; color:var(--dim);
  }
  .tpanel[hidden]{display:none;}
  .tpanel .lb{display:flex; justify-content:space-between; margin:0 0 6px; letter-spacing:.1em;}
  .tpanel .lb b{color:var(--accent); font-weight:500;}
  .tpanel input[type=range]{
    width:100%; margin:0 0 14px; accent-color:var(--accent); height:16px; cursor:pointer;
  }
  .tpanel .hue{
    background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#22d3ee,#6ea8ff,#a78bfa,#f472b6,#f87171);
    height:8px; border-radius:99px; margin-bottom:-11px; opacity:.55;
  }
  .trow{display:flex; gap:6px; margin-bottom:8px;}
  .trow button{
    flex:1; padding:7px 4px; border:1px solid var(--line); border-radius:7px;
    font-size:11px; color:var(--dim); transition:.14s;
  }
  .trow button:hover{background:rgba(var(--g1),.16); color:var(--text);}
  .trow button.on{background:var(--accent); color:var(--on-accent); border-color:transparent; font-weight:700;}
  .tcode{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--faint); font-size:10.5px; letter-spacing:.06em;}

  /* ====================== desktop ====================== */
  #desktop{position:fixed; inset:36px 0 56px 0; z-index:1;}
  .icons{position:absolute; top:18px; left:18px; display:grid; grid-template-columns:repeat(2,106px); gap:4px;}
  .icon{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:12px 6px; border-radius:10px; text-align:center;
    border:1px solid transparent; transition:background .14s, border-color .14s;
  }
  .icon:hover{background:rgba(var(--g1),.14);}
  .icon.sel{background:rgba(var(--g1),.24); border-color:var(--line-hi);}
  .icon svg{width:38px; height:38px; display:block;}
  .icon span{font-family:var(--mono); font-size:11px; color:var(--text); line-height:1.4; word-break:break-all;}

  .hint{
    position:absolute; right:22px; bottom:18px; max-width:240px; text-align:right;
    font-family:var(--mono); font-size:11px; color:var(--faint); line-height:1.95;
  }
  .hint b{color:var(--dim); font-weight:500;}

  /* ====================== windows ====================== */
  .win{
    position:absolute; z-index:10; display:flex; flex-direction:column;
    min-width:300px; border:1px solid var(--line-hi); border-radius:11px; overflow:hidden;
    background:var(--glass); backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 28px 66px var(--shadow);
    animation:pop .18s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes pop{from{opacity:0; transform:scale(.97) translateY(8px);} to{opacity:1; transform:none;}}
  .win.closing{animation:fadeout .14s ease both;}
  @keyframes fadeout{to{opacity:0; transform:scale(.97);}}
  .win .tbar{
    flex:0 0 auto; display:flex; align-items:center; gap:9px; padding:10px 12px;
    background:var(--chrome); border-bottom:1px solid var(--line);
    cursor:grab; user-select:none;
  }
  .win .tbar:active{cursor:grabbing;}
  .lights{display:flex; gap:7px; flex:0 0 auto;}
  .lights button{width:12px; height:12px; border-radius:50%; background:rgba(var(--g1),.3);}
  .lights .c{background:#fb7185;} .lights .m{background:#fbbf24;} .lights .z{background:#4ade80;}
  .lights button:hover{filter:brightness(1.25);}
  .win .ttl{font-family:var(--mono); font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .win.focus{border-color:var(--accent);}
  .win.focus .ttl{color:var(--text);}
  .win .body{flex:1; overflow-y:auto; padding:22px 24px 24px;}
  .win .body::-webkit-scrollbar{width:9px;}
  .win .body::-webkit-scrollbar-thumb{background:rgba(var(--g1),.3); border-radius:9px;}

  .body h2{font-size:21px; font-weight:740; letter-spacing:-.03em; margin-bottom:4px; color:var(--strong);}
  .body .sub{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase; margin-bottom:18px;}
  .body p{font-size:14.5px; line-height:1.95; color:var(--dim); word-break:keep-all; text-wrap:pretty;}
  .body p + p{margin-top:14px;}
  .body p b{color:var(--strong);}
  .body .rule{height:1px; background:var(--line); margin:20px 0;}
  dl.kv{display:grid; grid-template-columns:96px 1fr; gap:11px 16px; font-size:13.5px;}
  dl.kv dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); padding-top:3px;}
  dl.kv dd{font-weight:620; word-break:keep-all; color:var(--text);}
  .grp{margin-bottom:18px;}
  .grp h4{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--accent); margin-bottom:9px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tags span{font-family:var(--mono); font-size:11.5px; color:var(--dim); border:1px solid var(--line); background:rgba(var(--g1),.08); padding:4px 9px; border-radius:6px;}
  ul.bul{list-style:none; display:grid; gap:9px; margin-top:4px;}
  ul.bul li{position:relative; padding-left:17px; font-size:14.5px; line-height:1.85; color:var(--dim); word-break:keep-all;}
  ul.bul li::before{content:''; position:absolute; left:0; top:.8em; width:7px; height:1px; background:var(--accent);}
  .rolebox{margin-top:16px; padding:13px 15px; border:1px solid var(--line); border-radius:8px; background:rgba(var(--g1),.09); font-size:13px; color:var(--dim); word-break:keep-all;}
  .rolebox b{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--accent); display:block; margin-bottom:5px;}
  .cta{display:inline-flex; align-items:center; gap:7px; margin-top:18px; padding:10px 17px; border-radius:8px; background:var(--accent); color:var(--on-accent); font-size:13.5px; font-weight:700;}
  .cta:hover{text-decoration:none; box-shadow:0 8px 24px rgba(var(--g1),.35);}
  .filerow{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:8px;
    border:1px solid transparent; cursor:pointer; transition:background .14s, border-color .14s; width:100%; text-align:left;
  }
  .filerow:hover{background:rgba(var(--g1),.14); border-color:var(--line);}
  .filerow svg{width:26px; height:26px; flex:0 0 auto;}
  .filerow .n{font-family:var(--mono); font-size:13px; color:var(--text);}
  .filerow .m{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint);}

  /* ====================== dock ====================== */
  .dock{
    position:fixed; left:50%; transform:translateX(-50%); bottom:12px; z-index:400;
    display:flex; align-items:center; gap:6px; padding:8px 10px;
    background:var(--chrome); backdrop-filter:blur(16px);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:0 16px 38px var(--shadow);
    max-width:calc(100vw - 24px); overflow-x:auto;
  }
  .dock button{
    display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:9px;
    font-family:var(--mono); font-size:11.5px; color:var(--dim); white-space:nowrap;
    transition:background .14s, color .14s;
  }
  .dock button:hover{background:rgba(var(--g1),.18); color:var(--text);}
  .dock button.active{background:rgba(var(--g1),.26); color:var(--strong);}
  .dock button.active::after{content:''; width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .dock .sep{width:1px; height:22px; background:var(--line); margin:0 3px; flex:0 0 auto;}

  @media(max-width:760px){
    .icons{grid-template-columns:repeat(3,1fr); width:calc(100% - 24px); gap:2px; left:12px; right:12px;}
    .hint{display:none;}
    .menubar .mi{display:none;}
    .menubar .st{display:none;}
    #desktop{inset:36px 0 78px 0;}
    .win{
      position:fixed !important; inset:36px 0 78px 0 !important;
      width:auto !important; height:auto !important; border-radius:0; border-left:none; border-right:none;
    }
    .win .tbar{cursor:default;}
    .dock{bottom:10px; border-radius:12px;}
    .tpanel{width:228px;}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;} #rain{display:none;}}
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="veil"></div>

<!-- ================= boot ================= -->
<div id="boot">
  <div class="boot-logo" id="bootLogo"></div>
  <div class="boot-sub">gayoungOS</div>
  <div class="boot-lines" id="bootLines"></div>
  <div class="track"><i id="bootBar"></i></div>
  <div class="boot-hint">누르면 건너뛰기</div>
</div>

<!-- ================= menubar ================= -->
<div class="menubar">
  <span class="logo"><i></i>gayoungOS</span>
  <button class="mi" data-open="about">About</button>
  <button class="mi" data-open="stack">Stack</button>
  <button class="mi" data-open="projects">Projects</button>
  <button class="mi" data-open="contact">Contact</button>
  <div class="right">
    <span class="st"><i></i>open to work</span>

    <div class="tuner" id="tuner">
      <button id="tunerBtn" aria-expanded="false"><span class="sw"></span>색 조절</button>
      <div class="tpanel" id="tunerPanel" hidden>
        <p class="lb">색조 <b id="outH">222</b></p>
        <div class="hue"></div>
        <input type="range" id="rngH" min="0" max="359" value="222" aria-label="색조">
        <p class="lb">채도 <b id="outS">71</b></p>
        <input type="range" id="rngS" min="0" max="100" value="71" aria-label="채도">
        <div class="trow">
          <button data-mode="dark" class="on">어두운 배경</button>
          <button data-mode="light">밝은 배경</button>
        </div>
        <div class="trow">
          <button data-quick="mono">무채색</button>
          <button data-quick="reset">되돌리기</button>
        </div>
        <p class="tcode" id="tCode">H 222 · S 71 · dark</p>
      </div>
    </div>

    <span id="clock">--:--</span>
  </div>
</div>

<!-- ================= desktop ================= -->
<div id="desktop">
  <div class="icons" id="icons"></div>
  <div class="hint">
    <b>아이콘을 누르면 창이 열립니다</b><br>
    제목 표시줄을 끌어서 옮기고,<br>
    빨간 점으로 닫으세요.
  </div>
</div>

<div class="dock" id="dock"></div>

<script>
(function(){
  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = () => window.matchMedia('(max-width:760px)').matches;
  const root = document.documentElement;

  /* ==================== color engine ==================== */
  const DEFAULT = {h:222, s:71, mode:'dark'};
  let TH = Object.assign({}, DEFAULT);

  function hsl2rgb(h, s, l){
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)].join(',');
  }
  const H = (h, s, l, a) => a == null
    ? 'hsl(' + ((h % 360) + 360) % 360 + ' ' + s + '% ' + l + '%)'
    : 'hsl(' + ((h % 360) + 360) % 360 + ' ' + s + '% ' + l + '% / ' + a + ')';

  function applyTheme(persist){
    const {h, s, mode} = TH;
    const S = v => Math.max(0, Math.min(100, s * v));
    const set = (k, v) => root.style.setProperty(k, v);

    if(mode === 'light'){
      set('--wall',    H(h, S(.22), 96));
      set('--wall2',   H(h, S(.2),  92));
      set('--chrome',  H(h, S(.18), 100, .86));
      set('--glass',   H(h, S(.14), 100, .88));
      set('--line',    H(h, S(.5),  38, .22));
      set('--line-hi', H(h, S(.5),  38, .42));
      set('--accent',  H(h, Math.min(s, 72), 44));
      set('--accent2', H(h + 32, Math.min(s, 72), 38));
      set('--on-accent', H(h, S(.2), 99));
      set('--text',    H(h, S(.22), 14));
      set('--dim',     H(h, S(.14), 34));
      set('--faint',   H(h, S(.12), 56));
      set('--strong',  H(h, S(.35), 7));
      set('--g1', hsl2rgb(h, S(.6), 42));
      set('--g2', hsl2rgb(h + 32, S(.6), 40));
      set('--shadow', 'rgba(' + hsl2rgb(h, S(.4), 30) + ',.16)');
    } else {
      set('--wall',    H(h, S(.3),  4.5));
      set('--wall2',   H(h, S(.32), 3));
      set('--chrome',  H(h, S(.28), 10, .86));
      set('--glass',   H(h, S(.26), 13, .84));
      set('--line',    H(h, S(.65), 70, .22));
      set('--line-hi', H(h, S(.65), 70, .44));
      set('--accent',  H(h, Math.min(s, 80), 72));
      set('--accent2', H(h + 32, Math.min(s, 80), 68));
      set('--on-accent', H(h, S(.5), 8));
      set('--text',    H(h, S(.18), 92));
      set('--dim',     H(h, S(.14), 71));
      set('--faint',   H(h, S(.14), 48));
      set('--strong',  H(h, S(.1), 99));
      set('--g1', hsl2rgb(h, S(.7), 70));
      set('--g2', hsl2rgb(h + 32, S(.7), 66));
      set('--shadow', 'rgba(0,0,0,.6)');
    }
    root.setAttribute('data-mode', mode);

    document.getElementById('outH').textContent = h;
    document.getElementById('outS').textContent = s;
    document.getElementById('tCode').textContent = 'H ' + h + ' · S ' + s + ' · ' + mode;
    document.querySelectorAll('[data-mode]').forEach(b => {
      if(b.tagName === 'BUTTON') b.classList.toggle('on', b.getAttribute('data-mode') === mode);
    });
    document.getElementById('rngH').value = h;
    document.getElementById('rngS').value = s;

    if(persist){ try{ localStorage.setItem('gy-os-theme', JSON.stringify(TH)); }catch(_){} }
  }

  try{
    const saved = JSON.parse(localStorage.getItem('gy-os-theme') || 'null');
    if(saved && typeof saved.h === 'number') TH = Object.assign({}, DEFAULT, saved);
  }catch(_){}

  const tuner = document.getElementById('tuner');
  const tunerBtn = document.getElementById('tunerBtn');
  const tunerPanel = document.getElementById('tunerPanel');

  tunerBtn.addEventListener('click', e => {
    e.stopPropagation();
    const show = tunerPanel.hasAttribute('hidden');
    tunerPanel.toggleAttribute('hidden', !show);
    tunerBtn.setAttribute('aria-expanded', String(show));
  });
  document.addEventListener('click', e => {
    if(!tuner.contains(e.target)) tunerPanel.setAttribute('hidden', '');
  });

  function scrambleChar(ch){
    if(ch === ' ') return ' ';
    const c = ch.charCodeAt(0);

  function decrypt(el, text){
    if(REDUCE){ el.textContent = text; return; }
    const chars = Array.from(text);
    const settle = chars.map((_, i) => 6 + i * 7 + Math.random() * 7);
    let frame = 0;
    (function step(){
      let done = true, o = '';
      for(let i = 0; i < chars.length; i++){
        if(frame >= settle[i]) o += chars[i];
        else { done = false; o += '<span style="color:var(--accent)">' + scrambleChar(chars[i]) + '</span>'; }
      }
      el.innerHTML = o;
      frame++;
      if(!done) requestAnimationFrame(step);
      else el.textContent = text;
    })();
  }

  const STEPS = ['mount /dev/portfolio','load aws-infra.tf','verify ci-security.yml','start suricata · wazuh','decrypt identity'];
  let si = 0, finished = false;

  function finishBoot(){
    if(finished) return;
    finished = true;
    bootEl.classList.add('done');
    setTimeout(() => { bootEl.style.display = 'none'; }, 520);
    openWin('readme');
  }
  function step(){
    if(si >= STEPS.length){ setTimeout(finishBoot, 420); return; }
    const d = document.createElement('div');
    d.innerHTML = STEPS[si] + ' <span class="ok">ok</span>';
    linesEl.appendChild(d);
    if(linesEl.children.length > 4) linesEl.removeChild(linesEl.firstChild);
    si++;
    barEl.style.width = Math.round((si / STEPS.length) * 100) + '%';
    setTimeout(step, 260);
  }

  bootEl.addEventListener('click', finishBoot);
  decrypt(logoEl, '이가영');
  if(REDUCE){ barEl.style.width = '100%'; finishBoot(); }
  else setTimeout(step, 460);

  /* ==================== code rain ==================== */
  if(!REDUCE){
    const cv = document.getElementById('rain'), ctx = cv.getContext('2d');
    const G = '01ABCDEF/\\<>[]{}#$%&*+=?!~^|';
    const SIZE = 14;
    let W, H2, cols, drops, DPR;
    function size(){
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H2 = window.innerHeight;
      cv.width = W * DPR; cv.height = H2 * DPR;
      cv.style.width = W + 'px'; cv.style.height = H2 + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cols = Math.ceil(W / SIZE);
      drops = new Array(cols).fill(0).map(() => ({y: Math.random() * -H2, sp: 24 + Math.random()*50, lit: Math.random() < .18}));
    }
    const css = v => getComputedStyle(root).getPropertyValue(v).trim();
    let last = 0;
    function loop(ts){
      const dt = Math.min(.05, (ts - last)/1000 || 0); last = ts;
      ctx.fillStyle = css('--wall') || '#06060b';
      ctx.globalAlpha = .22; ctx.fillRect(0, 0, W, H2); ctx.globalAlpha = 1;
      const r1 = css('--g1'), r2 = css('--g2');
      const light = root.getAttribute('data-mode') === 'light';
      ctx.font = SIZE + 'px "JetBrains Mono", monospace';
      for(let i = 0; i < cols; i++){
        const d = drops[i];
        d.y += d.sp * dt;
        if(d.y > H2 + SIZE){ d.y = -SIZE - Math.random()*180; d.sp = 24 + Math.random()*50; d.lit = Math.random() < .18; }
        const a = light ? (d.lit ? .3 : .16) : (d.lit ? .5 : .26);
        ctx.fillStyle = 'rgba(' + (d.lit ? r2 : r1) + ',' + a + ')';
        ctx.fillText(G[Math.floor(Math.random()*G.length)], i * SIZE, d.y);
      }
      requestAnimationFrame(loop);
    }
    size(); window.addEventListener('resize', size); requestAnimationFrame(loop);
  }
})();
</script>
